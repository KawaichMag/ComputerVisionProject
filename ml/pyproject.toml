[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.11.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.121.2",
    "hf-xet>=1.2.0",
    "httpx>=0.28.1",
    "logging>=0.4.9.6",
    "pillow>=12.0.0",
    "python-multipart>=0.0.20",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "transformers>=4.57.1",
    "uvicorn>=0.38.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu118", marker = "sys_platform != 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu118", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
